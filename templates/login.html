<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход | Ramplez</title>
<style>
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; font-family: system-ui, -apple-system, sans-serif; color: #fff; overflow: hidden; }
  .bg { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #000 70%); z-index: -1; }
  .card { background: rgba(20, 20, 25, 0.6); backdrop-filter: blur(20px); padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
  h1 { font-size: 28px; font-weight: 800; margin-bottom: 30px; background: linear-gradient(90deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  input { width: 100%; padding: 15px; margin: 8px 0; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 15px; box-sizing: border-box; outline: none; transition: 0.3s; }
  input:focus { border-color: #6366f1; background: rgba(99,102,241,0.1); }
  button { width: 100%; padding: 15px; margin-top: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
  .btn-main { background: #6366f1; color: #fff; }
  .btn-main:hover { background: #4f46e5; transform: scale(0.98); }
  .btn-sec { background: transparent; color: #a1a1aa; border: 1px solid rgba(255,255,255,0.1); }
  .btn-sec:hover { background: rgba(255,255,255,0.05); }
  .error { color: #ef4444; font-size: 14px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
  <h1>Ramplez</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required>
    <input type="text" name="name" placeholder="Имя (опционально)">
    <input type="password" name="password" placeholder="Пароль" required>
    <button type="submit" name="action" value="login" class="btn-main">Войти</button>
    <button type="submit" name="action" value="register" class="btn-sec">Создать аккаунт</button>
  </form>
</div>
</body>
</html>
