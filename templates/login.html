<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><title>Ramplez — вход</title>
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon/180.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0b1020;color:#eaf0ff;padding:20px;overflow:hidden}
body:before,body:after{content:'';position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0}
body:before{width:520px;height:520px;background:#4f8cff;top:-160px;left:-140px;animation:f 14s ease-in-out infinite}
body:after{width:460px;height:460px;background:#a855f7;bottom:-150px;right:-120px;animation:f 18s ease-in-out infinite reverse}
@keyframes f{50%{transform:translate(60px,50px) scale(1.15)}}
.card{position:relative;z-index:1;width:100%;max-width:400px;background:rgba(20,27,48,.72);backdrop-filter:blur(22px);
border:1px solid rgba(255,255,255,.12);border-radius:26px;padding:30px 26px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#4f8cff,#a855f7);display:flex;align-items:center;justify-content:center;font-size:22px}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sub{text-align:center;color:#93a2c7;font-size:14px;margin:8px 0 22px}
.tabs{display:flex;background:rgba(255,255,255,.06);border-radius:14px;padding:4px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:0;background:none;color:#93a2c7;font-size:14px;font-weight:600;border-radius:11px;cursor:pointer;transition:.2s}
.tabs button.on{background:linear-gradient(135deg,#4f8cff,#6d7bff);color:#fff}
label{display:block;font-size:12px;color:#93a2c7;margin:12px 0 6px}
input{width:100%;padding:13px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#eaf0ff;font-size:15px;outline:none;transition:.2s}
input:focus{border-color:#4f8cff;background:rgba(79,140,255,.1)}
.go{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#4f8cff,#a855f7);color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:transform .12s}
.go:active{transform:scale(.97)}
.err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:11px;border-radius:12px;font-size:13px;margin-bottom:14px;text-align:center}
.hide{display:none}
.foot{text-align:center;color:#6b7a9e;font-size:11px;margin-top:18px;line-height:1.6}
</style></head><body>
<form class="card" method="post" autocomplete="on">
  <div class="logo"><div class="mark">💬</div><h1>ramplez</h1></div>
  <div class="sub">Сообщения со скоростью света</div>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <div class="tabs">
    <button type="button" id="tLogin" class="on">Вход</button>
    <button type="button" id="tReg">Регистрация</button>
  </div>
  <input type="hidden" name="act" id="act" value="login">
  <div id="nameBox" class="hide"><label>Как тебя зовут</label><input name="name" maxlength="64" placeholder="Иван"></div>
  <label>Логин</label><input name="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+" autocomplete="username" placeholder="ivan_99" autocapitalize="none">
  <label>Пароль</label><input name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="••••••••">
  <button class="go" id="go">Войти</button>
  <div class="foot">Регистрируясь, вы соглашаетесь с правилами сервиса.<br>Данные не передаются третьим лицам.</div>
</form>
<script>
var reg=false,tl=document.getElementById('tLogin'),tr=document.getElementById('tReg');
function mode(r){reg=r;tl.classList.toggle('on',!r);tr.classList.toggle('on',r);
document.getElementById('act').value=r?'register':'login';
document.getElementById('nameBox').classList.toggle('hide',!r);
document.getElementById('go').textContent=r?'Создать аккаунт':'Войти';
document.querySelector('[name=password]').autocomplete=r?'new-password':'current-password';}
tl.onclick=function(){mode(false)};tr.onclick=function(){mode(true)};
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(function(){});
</script></body></html>
