<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramplez | Вход</title>
<style>
  :root { --gold: #fbbf24; --dark: #0f172a; --darker: #020617; }
  body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--dark), var(--darker)); font-family: 'Inter', sans-serif; color: #fff; }
  .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 40px; border-radius: 24px; border: 1px solid rgba(251, 191, 36, 0.2); box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
  h1 { color: var(--gold); font-size: 32px; margin-bottom: 30px; font-weight: 800; letter-spacing: 2px; }
  input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; }
  input:focus { border-color: var(--gold); }
  button { width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
  .btn-primary { background: var(--gold); color: #000; }
  .btn-primary:hover { background: #f59e0b; transform: translateY(-2px); }
  .btn-secondary { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .error { color: #ef4444; margin-bottom: 15px; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>RAMPLEZ</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username (a-z, 0-9, _)" required>
    <input type="text" name="name" placeholder="Ваше имя (необязательно)">
    <input type="password" name="password" placeholder="Пароль" required>
    <button type="submit" name="action" value="login" class="btn-primary">Войти</button>
    <button type="submit" name="action" value="register" class="btn-secondary">Создать аккаунт</button>
  </form>
</div>
</body>
</html>
