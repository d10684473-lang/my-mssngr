<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ramplez</title>
    <style>
        :root {
            --bg-main: #d1d7db;
            --bg-sidebar: #ffffff;
            --bg-chat: #efeae2;
            --header-bg: #008069;
            --text-main: #111b21;
            --text-sub: #667781;
            --border-color: #e9edef;
            --hover-bg: #f0f2f5;
            --msg-mine: #d9fdd3;
            --msg-theirs: #ffffff;
            --input-bg: #f0f2f5;
            --input-field: #ffffff;
            --accent: #00a884;
        }
        body.dark {
            --bg-main: #091014;
            --bg-sidebar: #111b21;
            --bg-chat: #0b141a;
            --header-bg: #202c33;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --border-color: #222d34;
            --hover-bg: #202c33;
            --msg-mine: #005c4b;
            --msg-theirs: #202c33;
            --input-bg: #202c33;
            --input-field: #2a3942;
            --accent: #00a884;
        }

        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; height: 100dvh; background: var(--bg-main); color: var(--text-main); overflow: hidden; }
        
        /* Левая колонка */
        .sidebar { width: 35%; max-width: 390px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; height: 100%; }
        .my-profile { background: var(--header-bg); color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .profile-info { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; padding: 6px; border-radius: 50%; text-decoration: none; transition: 0.2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.15); }
        
        .search-box { padding: 10px 14px; background: var(--bg-sidebar); border-bottom: 1px solid var(--border-color); }
        .search-box input { width: 100%; padding: 10px 16px; border: none; border-radius: 22px; outline: none; font-size: 14px; background: var(--input-bg); color: var(--text-main); }
        
        .user-list { flex: 1; overflow-y: auto; }
        .user-item { padding: 12px 16px; border-bottom: 1px solid var(--border-color); text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; transition: 0.15s; }
        .user-item:hover, .user-item.active { background: var(--hover-bg); }
        
        .avatar { width: 48px; height: 48px; background: linear-gradient(135deg, #00a884, #00796b); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 19px; flex-shrink: 0; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.12); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Правая колонка */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-chat); height: 100%; position: relative; }
        .chat-header { background: var(--header-bg); color: white; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; min-height: 62px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); z-index: 2; }
        .chat-header-left { display: flex; align-items: center; gap: 12px; }
        .back-btn { display: none; text-decoration: none; color: white; font-size: 24px; padding-right: 6px; }
        .status-text { font-size: 12px; color: #b2dfdb; font-weight: normal; }
        
        .messages-box { flex: 1; padding: 16px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Сообщения */
        .msg { padding: 9px 13px; border-radius: 14px; max-width: 72%; font-size: 15px; word-wrap: break-word; line-height: 1.45; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
        .msg.mine { background: var(--msg-mine); align-self: flex-end; border-bottom-right-radius: 3px; }
        .msg.theirs { background: var(--msg-theirs); align-self: flex-start; border-bottom-left-radius: 3px; }
        .msg-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 4px; }
        .msg-sender { font-size: 11px; font-weight: bold; color: var(--accent); }
        .msg-actions { display: flex; gap: 5px; opacity: 0.75; }
        .msg:hover .msg-actions { opacity: 1; }
        .act-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 0 3px; color: var(--text-sub); transition: 0.1s; }
        .act-btn:hover { transform: scale(1.25); }
        .msg img.chat-img { max-width: 100%; max-height: 280px; border-radius: 10px; margin-top: 4px; display: block; cursor: pointer; }
        .msg audio { max-width: 240px; height: 36px; margin-top: 4px; }
        .msg-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; gap: 8px; }
        .reaction-badge { background: rgba(0,0,0,0.08); padding: 2px 7px; border-radius: 12px; font-size: 12px; }
        .msg-time { font-size: 10px; color: var(--text-sub); margin-left: auto; }
        
        /* Панель ответа и смайлов */
        .reply-preview { display: none; padding: 8px 16px; background: var(--input-bg); border-top: 1px solid var(--border-color); border-left: 4px solid var(--accent); justify-content: space-between; align-items: center; font-size: 13px; }
        .emoji-bar { display: none; padding: 8px 16px; background: var(--input-bg); border-top: 1px solid var(--border-color); gap: 12px; flex-wrap: wrap; }
        .emoji-bar span { font-size: 22px; cursor: pointer; }
        
        /* Ввод сообщения */
        .input-area { padding: 10px 14px; background: var(--input-bg); display: flex; align-items: center; gap: 8px; }
        .input-field { flex: 1; padding: 11px 16px; border: none; border-radius: 24px; outline: none; font-size: 15px; background: var(--input-field); color: var(--text-main); }
        .tool-btn { background: none; border: none; font-size: 21px; cursor: pointer; color: var(--text-sub); padding: 6px; border-radius: 50%; }
        .tool-btn:hover { background: rgba(0,0,0,0.06); }
        .tool-btn.recording { color: #e53935; animation: pulse 1s infinite; }
        .send-btn { background: var(--accent); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; justify-content: center; align-items: center; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,168,132,0.3); }
        
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.25); } 100% { transform: scale(1); } }
        .empty-state { margin: auto; color: var(--text-sub); font-size: 16px; text-align: center; padding: 20px; }

        /* Модальное окно профиля */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 100; justify-content: center; align-items: center; }
        .modal-card { background: var(--bg-sidebar); color: var(--text-main); padding: 25px; border-radius: 16px; width: 90%; max-width: 370px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); }
        .modal-card h3 { margin-top: 0; color: var(--accent); }
        .modal-input { width: 100%; padding: 10px 12px; margin: 6px 0 14px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--input-field); color: var(--text-main); font-family: inherit; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
        .btn-save { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: transparent; color: var(--text-sub); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 10px; cursor: pointer; }

        @media (max-width: 768px) {
            body.no-chat .sidebar { width: 100%; max-width: none; }
            body.no-chat .chat-area { display: none; }
            body.has-chat .sidebar { display: none; }
            body.has-chat .chat-area { display: flex; width: 100%; }
            .back-btn { display: block; }
            .msg { max-width: 85%; }
        }
    </style>
</head>
<body class="{{ 'has-chat' if active_user else 'no-chat' }}"
      data-my-id="{{ current_user.id }}"
      data-other-id="{{ active_user.id if active_user else 0 }}"
      data-other-name="{{ active_user.name if active_user else '' }}"
      data-other-bio="{{ active_user.bio if active_user else '' }}">

    <!-- Левая колонка -->
    <div class="sidebar">
        <div class="my-profile">
            <div class="profile-info">
                <div class="avatar" style="width:42px; height:42px; font-size:16px;">
                    {% if current_user.avatar %}<img src="{{ current_user.avatar }}">{% else %}{{ current_user.name[:1].upper() }}{% endif %}
                </div>
                <div>
                    <div style="font-weight:bold; font-size:15px;">{{ current_user.name }}</div>
                    <div style="font-size:12px; opacity:0.85;">@{{ current_user.username }}</div>
                </div>
            </div>
            <div>
                <button type="button" class="icon-btn" onclick="toggleTheme()" title="Сменить тему">🌓</button>
                <button type="button" class="icon-btn" onclick="openProfileModal()" title="Настройки профиля">⚙️</button>
                <a href="/logout" class="icon-btn" title="Выйти">🚪</a>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Поиск людей или @username..." onkeyup="filterUsers()">
