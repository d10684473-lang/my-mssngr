<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Гостевой чат</title><style>body{margin:0;font-family:sans-serif;background:#0e1621;color:#fff;display:flex;flex-direction:column;height:100vh;}.header{padding:15px;background:#17212b;text-align:center;border-bottom:1px solid #242f3d;}.messages{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;}.msg{padding:8px 12px;border-radius:12px;max-width:80%;background:#262d35;align-self:flex-start;}.msg.mine{background:#2b7de9;align-self:flex-end;}.msg .author{font-size:11px;color:#7f91a4;margin-bottom:2px;}.composer{display:flex;padding:10px;background:#17212b;border-top:1px solid #242f3d;}.composer input{flex:1;padding:10px;border-radius:20px;border:none;background:#0e1621;color:#fff;outline:none;}.composer button{background:#3390ec;color:#fff;border:none;border-radius:50%;width:40px;height:40px;margin-left:10px;cursor:pointer;}</style></head>
<body>
<div class="header">⚡ Гостевой чат. Вы: <strong>{{ name }}</strong></div>
<div class="messages" id="msgs"></div>
<div class="composer"><input type="text" id="inp" placeholder="Сообщение..."><button onclick="send()">➤</button></div>
<script>
const ROOM = "{{ room_id }}";
let lastId = 0;
function esc(s){return s.replace(/</g,'&lt;');}
async function poll(){
  try {
    let r = await fetch('/api/quick_poll/' + ROOM);
    let d = await r.json();
    if(d.ok){
      let box = document.getElementById('msgs');
      let atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 50;
      box.innerHTML = d.messages.map(m => `<div class="msg ${m.sender_id=={{ gid }}?'mine':''}"><div class="author">${esc(m.sender_name)}</div>${esc(m.content)}</div>`).join('');
      if(atBottom) box.scrollTop = box.scrollHeight;
    }
  } catch(e){}
  setTimeout(poll, 1000);
}
async function send(){
  let v = document.getElementById('inp').value.trim(); if(!v) return;
  document.getElementById('inp').value = '';
  await fetch('/api/quick_send/' + ROOM, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:v})});
}
document.getElementById('inp').addEventListener('keydown', e => { if(e.key==='Enter') send(); });
poll();
</script>
</body>
</html>
