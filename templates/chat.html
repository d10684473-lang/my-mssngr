<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ramplez</title>
<style>
  :root {
    --bg: #09090b; --panel: rgba(24, 24, 27, 0.7); --border: rgba(255,255,255,0.08);
    --text: #f4f4f5; --muted: #a1a1aa; --accent: #6366f1;
    --my-msg: linear-gradient(135deg, #6366f1, #8b5cf6); --other-msg: #27272a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100dvh; display: flex; overflow: hidden; }
  
  /* SIDEBAR */
  .sidebar { width: 360px; background: var(--panel); backdrop-filter: blur(20px); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
  .header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, #fff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .search-box { padding: 15px; }
  .search-box input { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; color: #fff; outline: none; transition: 0.3s; }
  .search-box input:focus { border-color: var(--accent); }
  .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; text-decoration: none; color: var(--text); transition: 0.2s; cursor: pointer; margin-bottom: 4px; }
  .chat-item:hover { background: rgba(255,255,255,0.05); }
  .chat-item.active { background: var(--accent); color: #fff; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: #3f3f46; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; flex-shrink: 0; position: relative; }
  .avatar.online::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; background: #10b981; border: 2px solid var(--bg); border-radius: 50%; }
  .chat-info { flex: 1; min-width: 0; }
  .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item.active .chat-sub { color: rgba(255,255,255,0.7); }
  .unread { background: #fff; color: var(--accent); font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 10px; }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; background: #000; position: relative; }
  .chat-header { padding: 15px 20px; background: var(--panel); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; z-index: 10; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  
  /* MESSAGES */
  .msg { max-width: 75%; padding: 10px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; position: relative; word-break: break-word; animation: slideUp 0.25s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: none; } }
  .msg.mine { align-self: flex-end; background: var(--my-msg); border-bottom-right-radius: 4px; }
  .msg.theirs { align-self: flex-start; background: var(--other-msg); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .msg-time { font-size: 11px; opacity: 0.6; text-align: right; margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; }
  .msg img { max-width: 100%; border-radius: 12px; margin-bottom: 5px; display: block; }
  .reply-quote { background: rgba(0,0,0,0.2); border-left: 3px solid rgba(255,255,255,0.5); padding: 4px 8px; margin-bottom: 6px; border-radius: 4px; font-size: 12px; opacity: 0.8; }
  .msg-reaction { position: absolute; bottom: -12px; right: 10px; background: #3f3f46; border: 1px solid var(--border); border-radius: 10px; padding: 2px 6px; font-size: 12px; cursor: pointer; }

  /* COMPOSER */
  .composer { padding: 15px 20px; background: var(--panel); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: flex-end; gap: 10px; }
  .input-wrapper { flex: 1; display: flex; align-items: flex-end; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 24px; padding: 8px 16px; }
  textarea { flex: 1; background: transparent; border: none; color: #fff; outline: none; resize: none; max-height: 120px; font-size: 15px; padding: 5px 0; font-family: inherit; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; padding: 8px; border-radius: 50%; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  .send-btn { background: var(--accent); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
  .send-btn:active { transform: scale(0.9); }

  /* CONTEXT MENU (Модалка действий) */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
  .modal.show { display: flex; }
  .modal-card { background: #18181b; border: 1px solid var(--border); border-radius: 20px; padding: 20px; width: 90%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; animation: pop 0.2s; }
  @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .action-btn { background: rgba(255,255,255,0.05); border: none; padding: 14px; border-radius: 12px; color: #fff; font-size: 15px; text-align: left; cursor: pointer; transition: 0.2s; display: flex; gap: 10px; align-items: center; }
  .action-btn:hover { background: rgba(255,255,255,0.1); }
  .action-btn.danger { color: #ef4444; }
  .emoji-row { display: flex; justify-content: space-between; font-size: 24px; margin-bottom: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 12px; }
  .emoji-row span { cursor: pointer; transition: 0.2s; }
  .emoji-row span:hover { transform: scale(1.3); }

  /* CALL OVERLAY */
  .call-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
  .call-overlay.show { display: block; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { position: absolute; top: 20px; right: 20px; width: 100px; height: 140px; border-radius: 16px; border: 2px solid var(--accent); object-fit: cover; z-index: 10; }
  .call-controls { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; gap: 20px; }
  .call-btn { width: 64px; height: 64px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; color: #fff; background: rgba(255,255,255,0.2); backdrop-filter: blur(10px); }
  .call-btn.end { background: #ef4444; }

  @media (max-width: 768px) {
    .sidebar { width: 100%; display: {{ 'none' if mode else 'flex' }}; }
    .main { display: {{ 'flex' if mode else 'none' }}; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="header">
    <div class="logo">RAMPLEZ</div>
    <div style="display:flex; gap:10px;">
      <a href="/logout" class="icon-btn" style="text-decoration:none;">🚪</a>
    </div>
  </div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск..." oninput="filterChats(this.value)">
  </div>
  <div class="chat-list" id="chatList"></div>
</div>

<!-- MAIN CHAT -->
<div class="main" id="mainPanel">
  {% if mode %}
  <div class="chat-header">
    {% if mode == 'personal' and other %}
      <a href="/chat" class="icon-btn" style="text-decoration:none; display:{{ 'block' if mode else 'none' }};">←</a>
      <div class="avatar {{ 'online' if other.last_seen > now - 30 else '' }}">{{ other.name[0]|upper }}</div>
      <div style="flex:1;">
        <div style="font-weight:600; font-size:16px;">{{ other.name }}</div>
        <div style="font-size:12px; color:var(--muted);" id="typingStatus">{{ 'В сети' if other.last_seen > now - 30 else 'Не в сети' }}</div>
      </div>
      <button class="icon-btn" onclick="startCall(false)">📞</button>
      <button class="icon-btn" onclick="startCall(true)">📹</button>
    {% elif mode == 'group' %}
      <a href="/chat" class="icon-btn" style="text-decoration:none; display:{{ 'block' if mode else 'none' }};">←</a>
      <div class="avatar">👥</div>
      <div style="font-weight:600; font-size:16px;">{{ group.title }}</div>
    {% endif %}
  </div>

  <div class="messages" id="messagesBox"></div>

  <div class="composer">
    <input type="file" id="fileInput" hidden onchange="uploadFile(this)">
    <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    
    <div class="input-wrapper">
      <textarea id="msgInput" rows="1" placeholder="Сообщение..." oninput="autoResize(this)" onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage(event)"></textarea>
    </div>
    
    <button class="icon-btn" id="micBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤</button>
    <button class="send-btn" onclick="sendMessage(event)">➤</button>
  </div>
  {% else %}
  <div style="margin: auto; text-align: center; color: var(--muted);">
    <h1 style="font-size:40px; margin-bottom:10px;">👋</h1>
    <h2>Выберите чат</h2>
  </div>
  {% endif %}
</div>

<!-- ACTION MODAL -->
<div class="modal" id="actionModal">
  <div class="modal-card">
    <div class="emoji-row" id="emojiPicker">
      <span onclick="reactMsg('❤️')">❤️</span><span onclick="reactMsg('🔥')">🔥</span><span onclick="reactMsg('😂')">😂</span><span onclick="reactMsg('👍')">👍</span><span onclick="reactMsg('😮')">😮</span>
    </div>
    <button class="action-btn" onclick="replyMsg()">↩️ Ответить</button>
    <button class="action-btn" id="editBtn" onclick="editMsg()" style="display:none;">✏️ Редактировать</button>
    <button class="action-btn danger" id="delAllBtn" onclick="deleteMsg('all')" style="display:none;">🗑️ Удалить у всех</button>
    <button class="action-btn danger" onclick="deleteMsg('me')">🗑️ Удалить у себя</button>
    <button class="action-btn" onclick="closeModal()">Закрыть</button>
  </div>
</div>

<!-- CALL OVERLAY -->
<div class="call-overlay" id="callOverlay">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="call-controls">
    <button class="call-btn end" onclick="endCall()">❌</button>
  </div>
</div>

<script>
  const ME_ID = {{ me.id }};
  const MODE = "{{ mode }}";
  const CHAT_ID = {{ other.id if mode == 'personal' and other else (group.id if mode == 'group' and group else 0) }};
  const CSRF = "{{ session.get('csrf_token', '') }}";
  const conversationsData = {{ conversations|tojson }};

  // ===== UI UTILS =====
  function escapeHtml(s){ let d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

  // ===== SIDEBAR =====
  function renderSidebar(list) {
    const box = document.getElementById('chatList');
    box.innerHTML = list.map(c => `
      <a href="/chat?${c.type==='group'?'g':'u'}=${c.id}" class="chat-item ${CHAT_ID===c.id?'active':''}">
        <div class="avatar ${c.online?'online':''}">${escapeHtml(c.title[0].toUpperCase())}</div>
        <div class="chat-info">
          <div class="chat-name">${escapeHtml(c.title)}</div>
          <div class="chat-sub">${escapeHtml(c.sub)}</div>
        </div>
        ${c.unread > 0 ? `<div class="unread">${c.unread}</div>` : ''}
      </a>
    `).join('');
  }
  renderSidebar(conversationsData);
  function filterChats(q) { renderSidebar(conversationsData.filter(c => c.title.toLowerCase().includes(q.toLowerCase()))); }

  // ===== CHAT LOGIC =====
  if (!CHAT_ID) { /* Empty state */ } else {
    const msgBox = document.getElementById('messagesBox');
    let renderedIds = new Set();
    let selectedMsg = null;

    function buildMsgHtml(m) {
      const isMine = m.sender_id === ME_ID;
      const isImg = m.msg_type === 'image';
      const isAudio = m.msg_type === 'audio';
      
      let content = escapeHtml(m.content).replace(/\n/g, '<br>');
      if (isImg) content = `<img src="${m.content}">`;
      if (isAudio) content = `<audio controls src="${m.content}" style="max-width:200px; height:36px;"></audio>`;
      
      let replyHtml = '';
      if (m.reply_to_id) {
        replyHtml = `<div class="reply-quote">Ответ на сообщение</div>`; // Упрощенно для скорости
      }

      return `
        ${replyHtml}
        ${content}
        <div class="msg-time">${m.timestamp} ${isMine ? (m.read_at > 0 ? '✓✓' : '✓') : ''}</div>
      `;
    }

    function appendMsg(m) {
      if(renderedIds.has(m.id)) return;
      renderedIds.add(m.id);
      const isMine = m.sender_id === ME_ID;
      const div = document.createElement('div');
      div.className = `msg ${isMine ? 'mine' : 'theirs'}`;
      div.id = 'msg-' + m.id;
      div.innerHTML = buildMsgHtml(m);
      
      if (m.reaction) {
        let react = document.createElement('div');
        react.className = 'msg-reaction';
        react.textContent = m.reaction;
        react.onclick = () => fetch(`/react_msg/${m.id}`, { method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':CSRF}, body: JSON.stringify({emoji: m.reaction})});
        div.appendChild(react);
      }

      // Context Menu trigger
      div.oncontextmenu = (e) => { e.preventDefault(); openModal(m); return false; };
      let pressTimer;
      div.ontouchstart = () => { pressTimer = setTimeout(() => openModal(m), 500); };
      div.ontouchend = () => clearTimeout(pressTimer);

      msgBox.appendChild(div);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    async function sendMessage(e) {
      if(e) e.preventDefault();
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if(!text) return;
      
      const tempId = 'temp_' + Date.now();
      const tempMsg = { id: tempId, sender_id: ME_ID, content: text, msg_type: 'text', timestamp: new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'}), read_at: 0 };
      appendMsg(tempMsg);
      input.value = ''; input.style.height = 'auto';
      
      try {
        const res = await fetch(MODE === 'group' ? '/send_group' : '/send', {
          method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF},
          body: JSON.stringify(MODE === 'group' ? {gid: CHAT_ID, content: text} : {oid: CHAT_ID, content: text})
        });
        const data = await res.json();
        if(data.ok) {
          document.getElementById('msg-' + tempId)?.remove(); 
          appendMsg(data.message);
        }
      } catch(e) {}
    }

    // ===== MODAL ACTIONS =====
    function openModal(m) {
      selectedMsg = m;
      document.getElementById('editBtn').style.display = (m.sender_id === ME_ID && m.msg_type === 'text') ? 'flex' : 'none';
      document.getElementById('delAllBtn').style.display = (m.sender_id === ME_ID) ? 'flex' : 'none';
      document.getElementById('actionModal').classList.add('show');
    }
    function closeModal() { document.getElementById('actionModal').classList.remove('show'); }
    
    async function reactMsg(emoji) {
      if(!selectedMsg) return;
      await fetch(`/react_msg/${selectedMsg.id}`, { method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':CSRF}, body: JSON.stringify({emoji}) });
      closeModal(); location.reload();
    }
    async function editMsg() {
      if(!selectedMsg) return;
      let newText = prompt("Редактировать:", selectedMsg.content);
      if(newText && newText !== selectedMsg.content) {
        await fetch(`/edit_msg/${selectedMsg.id}`, { method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':CSRF}, body: JSON.stringify({content: newText}) });
        closeModal(); location.reload();
      }
    }
    async function deleteMsg(type) {
      if(!selectedMsg) return;
      let url = type === 'all' ? `/del_all/${selectedMsg.id}` : `/del_me/${selectedMsg.id}`;
      await fetch(url, { method:'POST', headers:{'X-CSRFToken':CSRF} });
      closeModal(); location.reload();
    }

    // ===== SSE REALTIME =====
    const es = new EventSource('/stream');
    es.addEventListener('new_message', e => {
      const m = JSON.parse(e.data);
      if((MODE === 'personal' && (m.sender_id === CHAT_ID || m.receiver_id === CHAT_ID)) || (MODE === 'group' && m.receiver_id === -CHAT_ID)) {
        appendMsg(m);
      }
    });

    // ===== FILE UPLOAD =====
    async function uploadFile(input) {
      if(!input.files.length) return;
      let fd = new FormData();
      fd.append(MODE === 'group' ? 'gid' : 'oid', CHAT_ID);
      fd.append('file', input.files[0]);
      input.value = '';
      try {
        let res = await fetch('/upload_file', { method: 'POST', headers: {'X-CSRFToken': CSRF}, body: fd });
        let d = await res.json();
        if(d.ok) appendMsg(d.message);
      } catch(e) { alert('Ошибка загрузки'); }
    }

    // ===== VOICE RECORDING =====
    let mediaRecorder, audioChunks = [];
    async function startRecording() {
      try {
        let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          let blob = new Blob(audioChunks, { type: 'audio/webm' });
          let fd = new FormData();
          fd.append(MODE === 'group' ? 'gid' : 'oid', CHAT_ID);
          fd.append('file', blob, 'voice.webm');
          document.getElementById('micBtn').style.color = '';
          let res = await fetch('/upload_file', { method: 'POST', headers: {'X-CSRFToken': CSRF}, body: fd });
          let d = await res.json();
          if(d.ok) appendMsg(d.message);
        };
        mediaRecorder.start();
        document.getElementById('micBtn').style.color = '#ef4444';
      } catch(e) { alert('Нет доступа к микрофону'); }
    }
    function stopRecording() { if(mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop(); }
  }

  // ===== WEBRTC =====
  let pc, localStream;
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
  async function startCall(video) {
    if(!CHAT_ID) return;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video });
      document.getElementById('localVideo').srcObject = localStream;
      document.getElementById('callOverlay').classList.add('show');
      pc = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = e => document.getElementById('remoteVideo').srcObject = e.streams[0];
      pc.onicecandidate = e => { if(e.candidate) sendSignal('ice', e.candidate); };
      const offer = await pc.createOffer(); await pc.setLocalDescription(offer); sendSignal('offer', offer);
    } catch(e) { alert('Нет доступа к камере'); }
  }
  function sendSignal(type, payload) {
    fetch('/call_signal', { method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF}, body: JSON.stringify({ target_id: CHAT_ID, type, payload }) });
  }
  const esGlobal = new EventSource('/stream');
  esGlobal.addEventListener('call_signal', async e => {
    const d = JSON.parse(e.data);
    if(d.type === 'offer') {
      if(!confirm('Входящий звонок от ' + d.from_name + '. Принять?')) return;
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      document.getElementById('localVideo').srcObject = localStream;
      document.getElementById('callOverlay').classList.add('show');
      pc = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      pc.ontrack = ev => document.getElementById('remoteVideo').srcObject = ev.streams[0];
      pc.onicecandidate = ev => { if(ev.candidate) sendSignal('ice', ev.candidate); };
      await pc.setRemoteDescription(new RTCSessionDescription(d.payload));
      const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); sendSignal('answer', answer);
    } else if(d.type === 'answer' && pc) { await pc.setRemoteDescription(new RTCSessionDescription(d.payload)); } 
    else if(d.type === 'ice' && pc) { await pc.addIceCandidate(new RTCIceCandidate(d.payload)); }
  });
  function endCall() {
    if(pc) pc.close();
    if(localStream) localStream.getTracks().forEach(t => t.stop());
    document.getElementById('callOverlay').classList.remove('show');
  }
</script>
</body>
</html>
