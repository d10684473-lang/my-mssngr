<!DOCTYPE html>
<html lang="ru" class="{{ prefs.theme }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ramplez</title>
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon/180.png">
<link rel="icon" href="/icon/192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--ac:{{ prefs.accent }};--fs:{{ prefs.font }}px;--br:{{ prefs.radius }}px;
--bg:#0b1020;--p1:rgba(20,27,48,.78);--p2:rgba(28,37,64,.7);--tx:#eaf0ff;--mu:#93a2c7;
--bd:rgba(255,255,255,.1);--hv:rgba(255,255,255,.07);--mine:linear-gradient(135deg,var(--ac),#7c5cff);--other:rgba(255,255,255,.08)}
html.light{--bg:#eef1f8;--p1:rgba(255,255,255,.86);--p2:rgba(255,255,255,.75);--tx:#0d1428;--mu:#5d6b8c;
--bd:rgba(10,20,50,.1);--hv:rgba(10,20,50,.05);--other:#fff}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background:
radial-gradient(60vw 60vw at 8% -10%,var(--ac),transparent 60%),radial-gradient(50vw 50vw at 100% 100%,#a855f7,transparent 60%)}
body.wall-plain::before{opacity:.12}
body.wall-grid::before{opacity:.25;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:34px 34px}
body.wall-mesh::before{background:radial-gradient(40vw 40vw at 20% 20%,#22d3ee,transparent 60%),radial-gradient(45vw 45vw at 80% 70%,var(--ac),transparent 60%),radial-gradient(35vw 35vw at 50% 100%,#f472b6,transparent 60%)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:9px}
input,textarea,button,select{font-family:inherit;font-size:inherit;color:inherit}
.glass{background:var(--p1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#side{position:relative;z-index:2;width:340px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--bd);background:var(--p1);backdrop-filter:blur(20px)}
.sh{padding:12px;display:flex;align-items:center;gap:10px}
.ava{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),#a855f7);object-fit:cover;position:relative;overflow:hidden;font-size:16px}
.ava.on::after{content:'';position:absolute;right:1px;bottom:1px;width:11px;height:11px;background:#22c55e;border:2px solid var(--bg);border-radius:50%}
.ava.sm{width:30px;height:30px;font-size:12px}.ava.lg{width:96px;height:96px;font-size:38px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.6px;background:linear-gradient(90deg,var(--ac),#c084fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ib{background:none;border:0;color:var(--mu);width:36px;height:36px;border-radius:11px;cursor:pointer;display:grid;place-items:center;font-size:17px;transition:.15s;flex-shrink:0}
.ib:hover{background:var(--hv);color:var(--tx)}.ib:active{transform:scale(.9)}
.ib.act{color:var(--ac);background:var(--hv)}
.sp{padding:0 12px 10px}
#q{width:100%;padding:10px 14px;border-radius:13px;border:1px solid var(--bd);background:var(--hv);outline:none;transition:.15s}
#q:focus{border-color:var(--ac)}
.pills{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--bd);background:none;color:var(--mu);padding:5px 13px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
#chatList{flex:1;overflow-y:auto;padding:0 8px 8px}
.ci{display:flex;gap:11px;align-items:center;padding:10px;border-radius:15px;cursor:pointer;transition:.12s;margin-bottom:2px}
.ci:hover{background:var(--hv)}.ci.on{background:var(--ac);color:#fff}
.ci.on .sub,.ci.on .tm{color:rgba(255,255,255,.8)}
.cm{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:var(--mu);flex-shrink:0}
.sub{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.bg{background:var(--ac);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.ci.on .bg{background:#fff;color:var(--ac)}
.sf{padding:10px 12px;border-top:1px solid var(--bd);display:flex;gap:8px}
.btn{border:0;border-radius:13px;padding:11px 14px;cursor:pointer;font-weight:600;background:var(--hv);color:var(--tx);transition:.15s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--mine);color:#fff}.btn.dn{background:rgba(239,68,68,.16);color:#f87171}
.btn.w{width:100%}
#main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-width:0}
#head{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--p1);backdrop-filter:blur(20px);flex-shrink:0}
#hTitle{font-weight:700}
#hStatus{font-size:12px;color:var(--mu);height:16px;overflow:hidden}
#hStatus.on{color:#22c55e}#hStatus.tp{color:var(--ac)}
#pinBar{display:none;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--bd);background:var(--p2);font-size:13px;cursor:pointer;flex-shrink:0}
#pinBar.show{display:flex}
#pinText{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed{flex:1;overflow-y:auto;overscroll-behavior:contain}
#list{max-width:920px;margin:0 auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:5px}
.day{align-self:center;background:var(--p2);color:var(--mu);font-size:12px;font-weight:600;padding:4px 13px;border-radius:20px;margin:10px 0;backdrop-filter:blur(8px)}
.unread{align-self:stretch;text-align:center;color:var(--ac);font-size:12px;font-weight:700;border-top:1px solid var(--ac);margin:10px 0 4px;padding-top:6px;opacity:.85}
.row{display:flex;gap:8px;max-width:78%;animation:up .18s ease-out;position:relative}
.row.mine{align-self:flex-end;flex-direction:row-reverse}
.row.theirs{align-self:flex-start}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.row.sel .bb{outline:2px solid var(--ac);outline-offset:2px}
.stack{min-width:0;display:flex;flex-direction:column}
.mine .stack{align-items:flex-end}
.auth{font-size:12px;font-weight:700;margin:0 0 2px 6px}
.bb{padding:8px 12px;border-radius:var(--br);background:var(--other);border:1px solid var(--bd);word-break:break-word;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:100%}
.mine .bb{background:var(--mine);color:#fff;border-color:transparent;border-bottom-right-radius:5px}
.theirs .bb{border-bottom-left-radius:5px}
.bb.jumbo{background:none!important;border:0!important;box-shadow:none;font-size:44px;line-height:1.15;padding:2px}
.fwd{font-size:11px;opacity:.75;margin-bottom:3px}
.qt{border-left:3px solid currentColor;padding:2px 0 2px 8px;margin-bottom:5px;font-size:12px;opacity:.85;cursor:pointer}
.qt b{display:block;font-size:11px}
.tx a{color:inherit;text-decoration:underline}
.tx code{background:rgba(127,127,127,.25);padding:1px 5px;border-radius:5px;font-family:ui-monospace,monospace;font-size:.92em}
.tx .mn{color:#fbbf24;font-weight:600}
.mine .tx .mn{color:#fde68a}
.bb img.ph{max-width:min(300px,68vw);max-height:340px;border-radius:11px;display:block;cursor:zoom-in}
.bb audio{width:min(240px,60vw);height:36px;display:block}
.fl{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;padding:3px 0}
.fi{width:38px;height:38px;border-radius:11px;background:rgba(127,127,127,.25);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.fn{font-weight:600;font-size:13px;word-break:break-all}.fz{font-size:11px;opacity:.7}
.ft{display:flex;gap:5px;align-items:center;justify-content:flex-end;font-size:10.5px;opacity:.75;margin-top:3px;white-space:nowrap}
.tk{font-weight:800;letter-spacing:-2px}.tk.rd{color:#4ade80;opacity:1}
.rc{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.rb{background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:1px 7px;font-size:12px;cursor:pointer;user-select:none}
.rb.me{background:var(--ac);border-color:var(--ac);color:#fff}
.hl{animation:hl 1.4s}
@keyframes hl{0%,100%{background:transparent}30%{background:var(--hv)}}
#fab{position:absolute;right:18px;bottom:96px;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--p1);backdrop-filter:blur(12px);color:var(--tx);cursor:pointer;display:none;place-items:center;font-size:18px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#fab.show{display:grid}
#fab .bg{position:absolute;top:-4px;right:-4px}
#replyBar{display:none;align-items:center;gap:9px;padding:8px 14px;border-top:1px solid var(--bd);background:var(--p2);font-size:13px}
#replyBar.show{display:flex}
#replyText{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#recBar{display:none;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--bd);background:rgba(239,68,68,.14);color:#f87171;font-weight:600}
#recBar.show{display:flex}
.dot{width:9px;height:9px;border-radius:50%;background:#ef4444;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#composer{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);background:var(--p1);backdrop-filter:blur(20px);flex-shrink:0}
.cin{max-width:920px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;background:var(--hv);border:1px solid var(--bd);border-radius:22px;padding:4px 6px;transition:.15s}
.cin:focus-within{border-color:var(--ac)}
#input{flex:1;background:none;border:0;outline:none;resize:none;max-height:132px;padding:9px 4px;line-height:1.4}
#btnSend{width:38px;height:38px;border-radius:50%;border:0;background:var(--mine);color:#fff;cursor:pointer;display:grid;place-items:center;font-size:15px;flex-shrink:0;transition:.12s}
#btnSend:active{transform:scale(.88)}
#emojiPanel{display:none;flex-wrap:wrap;gap:4px;max-width:920px;margin:0 auto 8px;background:var(--p2);border:1px solid var(--bd);border-radius:16px;padding:8px;max-height:150px;overflow-y:auto}
#emojiPanel.show{display:flex}
#emojiPanel span{font-size:23px;cursor:pointer;padding:3px;border-radius:8px}
#emojiPanel span:hover{background:var(--hv)}
#empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--mu);padding:30px}
#modal{position:fixed;inset:0;z-index:200;background:rgba(4,8,20,.66);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modalCard{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--p1);backdrop-filter:blur(26px);border:1px solid var(--bd);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 70px rgba(0,0,0,.5);animation:pop .18s}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
#modalCard h3{font-size:19px;font-weight:800;text-align:center}
.fld{display:flex;flex-direction:column;gap:5px}
.lb{font-size:12px;color:var(--mu)}
.in{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--bd);background:var(--hv);outline:none}
.in:focus{border-color:var(--ac)}
.row2{display:flex;gap:9px;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:none;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--mu)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.lst{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.li{display:flex;align-items:center;gap:10px;padding:9px;border-radius:13px;cursor:pointer}
.li:hover{background:var(--hv)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.tg{width:44px;height:25px;border-radius:14px;background:var(--bd);border:0;cursor:pointer;position:relative;flex-shrink:0;transition:.2s}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--ac)}.tg.on::after{left:22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);overflow-x:auto}
.tab{padding:9px 12px;font-size:13px;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--ac);border-color:var(--ac);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid3 img{width:100%;height:84px;object-fit:cover;border-radius:9px;cursor:zoom-in}
#ctx{position:fixed;z-index:300;display:none;flex-direction:column;background:var(--p1);backdrop-filter:blur(22px);border:1px solid var(--bd);border-radius:16px;padding:6px;box-shadow:0 20px 50px rgba(0,0,0,.45);min-width:196px;animation:pop .12s}
#ctx.show{display:flex}
#ctx button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:14px;display:flex;gap:9px;align-items:center}
#ctx button:hover{background:var(--hv)}
#ctx .em{display:flex;justify-content:space-between;padding:4px 6px 8px;border-bottom:1px solid var(--bd);margin-bottom:4px}
#ctx .em span{font-size:22px;cursor:pointer;transition:.1s}
#ctx .em span:hover{transform:scale(1.28)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--p1);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:14px;padding:10px 16px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:up .2s;max-width:88vw}
.toast.err{border-color:rgba(239,68,68,.5);color:#fca5a5}
.toast.ok{border-color:rgba(34,197,94,.5)}
#conn{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:400;font-size:12px;padding:5px 13px;border-radius:20px;background:var(--p1);border:1px solid var(--bd);backdrop-filter:blur(12px);display:none}
#conn.show{display:block}
#selBar{display:none;align-items:center;gap:9px;padding:10px 14px;border-top:1px solid var(--bd);background:var(--p2)}
#selBar.show{display:flex}
#lightbox{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.94);display:none;place-items:center;padding:14px}
#lightbox.show{display:grid}
#lbImg{max-width:100%;max-height:100%;border-radius:10px}
#lbClose{position:absolute;top:14px;right:14px;font-size:26px;color:#fff;background:none;border:0;cursor:pointer}
.emptyBox{text-align:center;color:var(--mu);padding:26px;font-size:14px}
@media(max-width:820px){
#side{width:100%;position:absolute;inset:0;z-index:3}
body.open #side{display:none}
#main{display:none}body.open #main{display:flex}
.row{max-width:88%}#modalCard{max-width:100%}
#fab{bottom:104px;right:12px}
}
@media(min-width:821px){#btnBack{display:none}}
</style>
</head>
<body class="wall-{{ prefs.wall }}">

<aside id="side">
  <div class="sh">
    <div id="meAva" class="ava"></div>
    <div style="flex:1;min-width:0"><div class="brand">ramplez</div><div id="meName" class="sub"></div></div>
    <button class="ib" id="btnNewGroup" title="Новая группа">✚</button>
    <button class="ib" id="btnTheme" title="Тема">◐</button>
    <button class="ib" id="btnSettings" title="Настройки">⚙</button>
  </div>
  <div class="sp"><input id="q" placeholder="Поиск людей и чатов…" autocomplete="off"></div>
  <div class="pills" id="filters">
    <button class="pill on" data-f="all">Все</button>
    <button class="pill" data-f="user">Личные</button>
    <button class="pill" data-f="group">Группы</button>
    <button class="pill" data-f="unread">Непрочитанные</button>
  </div>
  <div id="chatList"></div>
  <div class="sf">
    <button class="btn w" id="btnSearch">🔍 Поиск сообщений</button>
    <button class="btn" id="btnInstall" style="display:none" title="Установить">📲</button>
  </div>
</aside>

<main id="main">
  <div id="head">
    <button class="ib" id="btnBack">←</button>
    <div id="hAva" class="ava"></div>
    <div style="flex:1;min-width:0;cursor:pointer" id="hInfo">
      <div id="hTitle">Ramplez</div><div id="hStatus"></div>
    </div>
    <button class="ib" id="btnChatSearch" title="Поиск в чате">🔍</button>
    <button class="ib" id="btnInfo" title="Инфо">ⓘ</button>
  </div>
  <div id="pinBar"><span>📌</span><div id="pinText"></div><button class="ib" id="pinClose">✕</button></div>
  <div id="feed"><div id="list"></div></div>
  <button id="fab">↓<span class="bg" id="fabCount" style="display:none">0</span></button>
  <div id="empty"><div><div style="font-size:52px">💬</div><h3 style="margin:10px 0 6px">Выбери чат</h3><div>Или найди друга через поиск слева</div></div></div>
  <div id="selBar"><b id="selCount">0</b><div style="flex:1"></div>
    <button class="btn" id="btnSelFwd">➡ Переслать</button>
    <button class="btn dn" id="btnSelDel">🗑 Удалить</button>
    <button class="ib" id="btnSelCancel">✕</button></div>
  <div id="replyBar"><span>↩</span><div id="replyText"></div><button class="ib" id="btnReplyCancel">✕</button></div>
  <div id="recBar"><span class="dot"></span><span>Запись…</span><b id="recTime">0:00</b><div style="flex:1"></div>
    <button class="btn dn" id="btnRecCancel">Отмена</button><button class="btn pri" id="btnRecStop">Отправить</button></div>
  <div id="composer">
    <div id="emojiPanel"></div>
    <div class="cin">
      <input type="file" id="fileInput" hidden multiple>
      <button class="ib" id="btnAttach" title="Файл">📎</button>
      <button class="ib" id="btnEmoji" title="Эмодзи">☺</button>
      <textarea id="input" rows="1" placeholder="Сообщение…"></textarea>
      <button class="ib" id="btnMic" title="Голосовое">🎤</button>
      <button id="btnSend" title="Отправить">➤</button>
    </div>
  </div>
</main>

<div id="modal"><div id="modalCard"><div id="modalBody"></div></div></div>
<div id="ctx"></div>
<div id="toasts"></div>
<div id="conn"></div>
<div id="lightbox"><button id="lbClose">✕</button><img id="lbImg" alt=""></div>

<script>
(function(){
'use strict';
const ME={{ mej|tojson }}, CSRF={{ csrf|tojson }}, USERS={{ users|tojson }};
let PREFS={{ prefs|tojson }}, CONVS={{ convs|tojson }}, KEY={{ key|tojson }};
const EMJ=['👍','❤️','😂','🔥','😮','😢','🎉','👎'];
const PICK='😀 😁 😂 🤣 😊 😍 😘 😎 🤔 😐 😴 😭 😡 🥳 🤯 🥺 👍 👎 👌 🙏 👏 💪 🔥 ✨ 🎉 💯 ❤️ 💔 ⚡ 🚀 🍕 ☕ 🎮 🎵 📌 ✅ ❌ ⭐ 🌈 🐱 🐶'.split(' ');
const $=s=>document.getElementById(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;};
const enc=encodeURIComponent;

let MSGS=new Map(), ROWS=new Map(), QUOTES={}, NAMES={}, READS={}, CTX=null, SINCE=0, MORE=false;
let REPLY=null, SEL=new Set(), SEEN_LAST=0, ES=null, esOK=false, busy=false, loadingOld=false;
let unreadNew=0, titleBase='Ramplez', audioCtx=null, rec=null, recChunks=[], recT=0, recTimer=null, recCancel=false;
let installEvt=null, filter='all', query='', draftKey='rz_draft_';

/* ---------- utils ---------- */
function toast(m,t){const e=el('div','toast'+(t?' '+t:''),esc(m));$('toasts').appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='.3s';setTimeout(()=>e.remove(),300);},2600);}
function hue(s){let h=0;for(let i=0;i<s.length;i++)h=s.charCodeAt(i)+((h<<5)-h);return Math.abs(h)%360;}
function avaHTML(o,cls){
  const n=(o&&o.name||o&&o.title||'?').trim();const c=n.charAt(0).toUpperCase()||'?';
  const on=o&&o.online?' on':'';const k='ava'+(cls?' '+cls:'')+on;
  if(o&&o.avatar)return '<img class="'+k+'" src="'+esc(o.avatar)+'" alt="">';
  if(o&&o.type==='group')return '<div class="'+k+'" style="background:linear-gradient(135deg,#22d3ee,#3b82f6)">👥</div>';
  if(o&&o.type==='saved')return '<div class="'+k+'" style="background:linear-gradient(135deg,#f59e0b,#ef4444)">★</div>';
  return '<div class="'+k+'" style="background:linear-gradient(135deg,hsl('+hue(n)+',70%,58%),hsl('+((hue(n)+50)%360)+',70%,48%))">'+esc(c)+'</div>';
}
function setAva(node,o,cls){node.outerHTML=avaHTML(o,cls);}
const tm=ts=>new Date(ts*1000).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
function day(ts){const d=new Date(ts*1000),t=new Date(),y=new Date();y.setDate(y.getDate()-1);
 if(d.toDateString()===t.toDateString())return 'Сегодня';if(d.toDateString()===y.toDateString())return 'Вчера';
 return d.toLocaleDateString('ru',{day:'numeric',month:'long',year:d.getFullYear()!==t.getFullYear()?'numeric':undefined});}
function ago(ts){if(!ts)return 'был(а) давно';const s=Date.now()/1000-ts;
 if(s<60)return 'был(а) только что';if(s<3600)return 'был(а) '+Math.floor(s/60)+' мин назад';
 if(s<86400)return 'был(а) '+Math.floor(s/3600)+' ч назад';return 'был(а) '+new Date(ts*1000).toLocaleDateString('ru');}
const sz=n=>n<1024?n+' Б':n<1048576?(n/1024).toFixed(1)+' КБ':(n/1048576).toFixed(1)+' МБ';
function md(t){
  let s=esc(t);
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/__([^_\n]+)__/g,'<i>$1</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>')
     .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>')
     .replace(/(^|\s)(@[a-z0-9_]{3,32})/gi,'$1<span class="mn">$2</span>').replace(/\n/g,'<br>');
  return s;
}
const isEmojiOnly=t=>{const c=t.replace(/\s/g,'');return c.length>0&&c.length<=9&&/^(\p{Extended_Pictographic}|\u200d|\ufe0f)+$/u.test(c);};

/* ---------- api ---------- */
async function api(p,o){
  o=o||{};const h=new Headers(o.headers||{});
  if(o.method&&o.method!=='GET'){h.set('X-CSRF',CSRF);if(o.json!==undefined)h.set('Content-Type','application/json');}
  const r=await fetch(p,{method:o.method||'GET',headers:h,body:o.json!==undefined?JSON.stringify(o.json):o.body,cache:'no-store'});
  if(r.status===401){location.href='/';throw new Error('auth');}
  let d={};try{d=await r.json();}catch(e){}
  if(!r.ok||d.ok===false)throw new Error(d.error||('HTTP '+r.status));
  return d;
}
const post=(p,j)=>api(p,{method:'POST',json:j||{}});

/* ---------- prefs ---------- */
function applyPrefs(){
  const r=document.documentElement;
  let th=PREFS.theme;
  if(th==='auto')th=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  r.className=th;
  r.style.setProperty('--ac',PREFS.accent);r.style.setProperty('--fs',PREFS.font+'px');r.style.setProperty('--br',PREFS.radius+'px');
  document.body.className='wall-'+PREFS.wall+(document.body.classList.contains('open')?' open':'');
  try{localStorage.setItem('rz_prefs',JSON.stringify(PREFS));}catch(e){}
}
try{const c=localStorage.getItem('rz_prefs');if(c)PREFS=Object.assign(PREFS,JSON.parse(c));}catch(e){}
applyPrefs();
matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(PREFS.theme==='auto')applyPrefs();});
async function savePrefs(p){Object.assign(PREFS,p);applyPrefs();try{const d=await post('/api/settings',p);PREFS=d.prefs;applyPrefs();}catch(e){toast(e.message,'err');}}

/* ---------- sound / notify ---------- */
function beep(){
  if(!PREFS.sound)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
   const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);
   o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.05,audioCtx.currentTime);
   g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.2);o.start();o.stop(audioCtx.currentTime+.2);}catch(e){}
}
function badge(n){
  document.title=n>0?'('+n+') '+titleBase:titleBase;
  try{if(n>0&&navigator.setAppBadge)navigator.setAppBadge(n);else if(navigator.clearAppBadge)navigator.clearAppBadge();}catch(e){}
}
function notify(title,body){
  if(!PREFS.notify||!document.hidden)return;
  try{if(Notification.permission==='granted')new Notification(title,{body:body,icon:'/icon/192.png',badge:'/icon/192.png',tag:'rz'});}catch(e){}
}
document.addEventListener('click',()=>{try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}},{once:true});
window.addEventListener('focus',()=>{unreadNew=0;badge(totalUnread());});
function totalUnread(){return CONVS.reduce((a,c)=>a+(c.key===KEY?0:c.unread||0),0);}

/* ---------- sidebar ---------- */
function renderSide(){
  const box=$('chatList');const sc=box.scrollTop;box.innerHTML='';
  const list=CONVS.filter(c=>{
    if(filter==='unread'&&!c.unread)return false;
    if(filter==='user'&&c.type!=='user'&&c.type!=='saved')return false;
    if(filter==='group'&&c.type!=='group')return false;
    if(query&&(c.title||'').toLowerCase().indexOf(query)<0&&(c.sub||'').toLowerCase().indexOf(query)<0)return false;
    return true;
  });
  if(!list.length){box.appendChild(el('div','emptyBox','Ничего не найдено'));return;}
  list.forEach(c=>{
    const a=el('div','ci'+(c.key===KEY?' on':''));
    a.innerHTML=avaHTML(c)+'<div class="cm"><div class="r1"><span class="nm">'+esc(c.title)+'</span><span class="tm">'+(c.at?tm(c.at):'')+'</span></div>'+
      '<div class="r1"><span class="sub">'+esc(c.sub||'')+'</span>'+(c.unread?'<span class="bg">'+c.unread+'</span>':'')+'</div></div>';
    a.onclick=()=>openChat(c.key);
    box.appendChild(a);
  });
  box.scrollTop=sc;badge(totalUnread());
}
async function loadSide(){try{const d=await api('/api/conversations');CONVS=d.convs;renderSide();}catch(e){}}
$('filters').onclick=e=>{const b=e.target.closest('.pill');if(!b)return;
  [...$('filters').children].forEach(x=>x.classList.toggle('on',x===b));filter=b.dataset.f;renderSide();};
let qT=null;
$('q').oninput=()=>{query=$('q').value.trim().toLowerCase();renderSide();clearTimeout(qT);
  if(query.length<2)return;qT=setTimeout(async()=>{
    try{const d=await api('/api/search/users?q='+enc(query));
      const known=new Set(CONVS.map(c=>c.type==='user'?c.id:0));
      const add=d.users.filter(u=>!known.has(u.id));
      if(!add.length)return;
      const box=$('chatList');
      box.appendChild(el('div','day','Люди'));
      add.forEach(u=>{const a=el('div','ci');
        a.innerHTML=avaHTML(u)+'<div class="cm"><div class="nm">'+esc(u.name)+'</div><div class="sub">@'+esc(u.username)+'</div></div>';
        a.onclick=()=>openChat('p:'+Math.min(ME.id,u.id)+':'+Math.max(ME.id,u.id));box.appendChild(a);});
    }catch(e){}},300);};
$('btnTheme').onclick=()=>{const cur=document.documentElement.className;savePrefs({theme:cur==='dark'?'light':'dark'});};

/* ---------- messages render ---------- */
function senderOf(m){
  if(m.sender===ME.id)return ME;
  if(NAMES[m.sender])return {name:NAMES[m.sender].name,avatar:NAMES[m.sender].avatar,id:m.sender};
  const mb=(CTX&&CTX.members||[]).find(x=>x.id===m.sender);
  return mb||{name:'Аккаунт удалён',avatar:'',id:m.sender};
}
function ticks(m){
  if(m.sender!==ME.id)return '';
  if(typeof m.id!=='number')return '<span class="tk">🕓</span>';
  let n=0;
  if(CTX.kind==='group')n=(CTX.members||[]).filter(x=>x.id!==ME.id&&(READS[x.id]||0)>=m.id).length;
  else n=(READS[CTX.other]||0)>=m.id?1:0;
  return '<span class="tk'+(n?' rd':'')+'"'+(CTX.kind==='group'&&n?' title="Прочитали: '+n+'"':'')+'>✓'+(n?'✓':'')+'</span>';
}
function rcHTML(m){
  if(!m.reactions||!m.reactions.length)return '';
  const g={};m.reactions.forEach(r=>{(g[r.e]=g[r.e]||[]).push(r.u);});
  return '<div class="rc">'+Object.keys(g).map(e=>{
    const us=g[e],mine=us.indexOf(ME.id)>=0;
    const names=us.map(u=>u===ME.id?'Вы':senderOf({sender:u}).name).join(', ');
    return '<span class="rb'+(mine?' me':'')+'" data-e="'+esc(e)+'" title="'+esc(names)+'">'+e+' '+us.length+'</span>';
  }).join('')+'</div>';
}
function bodyHTML(m){
  if(m.kind==='image')return '<img class="ph" src="'+esc(m.body)+'" alt="фото" loading="lazy">';
  if(m.kind==='audio')return '<audio controls preload="metadata" src="'+esc(m.body)+'"></audio>';
  if(m.kind==='file')return '<a class="fl" href="'+esc(m.body)+'" download="'+esc(m.fname)+'"><span class="fi">📄</span><span><span class="fn">'+esc(m.fname||'Файл')+'</span><br><span class="fz">'+sz(m.fsize||0)+'</span></span></a>';
  return '<div class="tx'+(isEmojiOnly(m.body)?'':'')+'">'+md(m.body)+'</div>';
}
function rowOf(m){
  const mine=m.sender===ME.id, s=senderOf(m);
  const row=el('div','row '+(mine?'mine':'theirs'));row.dataset.id=m.id;
  let inner='';
  if(CTX.kind==='group'&&!mine)inner+=avaHTML(s,'sm');
  let bb='';
  if(m.fwd)bb+='<div class="fwd">↪ переслано от '+esc(m.fwd)+'</div>';
  if(m.reply&&QUOTES[m.reply]){const q=QUOTES[m.reply];
    bb+='<div class="qt" data-jump="'+q.id+'"><b>'+esc(q.name)+'</b>'+esc(q.body)+'</div>';}
  bb+=bodyHTML(m);
  bb+='<div class="ft">'+(m.edited?'<span>изм.</span>':'')+(m.pinned?'<span>📌</span>':'')+'<span>'+tm(m.created)+'</span>'+ticks(m)+'</div>';
  const jumbo=m.kind==='text'&&isEmojiOnly(m.body);
  inner+='<div class="stack">'+(CTX.kind==='group'&&!mine?'<div class="auth" style="color:hsl('+hue(s.name)+',70%,65%)">'+esc(s.name)+'</div>':'')+
    '<div class="bb'+(jumbo?' jumbo':'')+'">'+bb+'</div>'+rcHTML(m)+'</div>';
  row.innerHTML=inner;
  if(SEL.has(m.id))row.classList.add('sel');
  wireRow(row,m);
  return row;
}
function wireRow(row,m){
  let t=null,moved=false;
  const open=e=>{e.preventDefault();ctxMenu(m,e.clientX||(row.getBoundingClientRect().left+30),e.clientY||(row.getBoundingClientRect().top+20));};
  row.addEventListener('contextmenu',open);
  row.addEventListener('touchstart',e=>{moved=false;const x=e.touches[0].clientX,y=e.touches[0].clientY;
    t=setTimeout(()=>{t=null;open({preventDefault(){},clientX:x,clientY:y});},420);},{passive:true});
  row.addEventListener('touchmove',()=>{moved=true;if(t){clearTimeout(t);t=null;}},{passive:true});
  row.addEventListener('touchend',()=>{if(t){clearTimeout(t);t=null;}});
  row.addEventListener('click',e=>{
    if(moved)return;
    const rb=e.target.closest('.rb');
    if(rb){react(m.id,rb.dataset.e);return;}
    const qt=e.target.closest('.qt');
    if(qt){jump(+qt.dataset.jump);return;}
    if(e.target.tagName==='IMG'&&e.target.classList.contains('ph')){lightbox(e.target.src);return;}
    if(e.target.closest('a')||e.target.tagName==='AUDIO')return;
    if(SEL.size){toggleSel(m.id);return;}
    if(e.detail===2){react(m.id,'❤️');}
  });
}
function jump(id){
  const r=ROWS.get(id);
  if(!r){toast('Сообщение выше — прокрути вверх');return;}
  r.scrollIntoView({behavior:'smooth',block:'center'});r.classList.add('hl');setTimeout(()=>r.classList.remove('hl'),1500);
}
function sep(ts){return el('div','day',esc(day(ts)));}
function renderAll(){
  const list=$('list');list.innerHTML='';ROWS.clear();
  const arr=[...MSGS.values()].sort((a,b)=>a.id-b.id);
  let last=null,marked=false;
  const myLast=READS[ME.id]||0;
  arr.forEach(m=>{
    const d=new Date(m.created*1000).toDateString();
    if(d!==last){list.appendChild(sep(m.created));last=d;}
    if(!marked&&myLast&&m.id>myLast&&m.sender!==ME.id){list.appendChild(el('div','unread','Непрочитанные'));marked=true;}
    const r=rowOf(m);ROWS.set(m.id,r);list.appendChild(r);
  });
  if(!arr.length)list.appendChild(el('div','emptyBox','Пока пусто. Напиши первым 👋'));
  SEEN_LAST=arr.length?arr[arr.length-1].id:0;
}
function upsert(m,scroll){
  if(typeof m.id!=='number')return;
  const old=MSGS.get(m.id);
  if(old&&old.updated>=m.updated&&old.reactions.length===m.reactions.length)return;
  MSGS.set(m.id,m);
  const feed=$('feed'),bottom=feed.scrollHeight-feed.scrollTop-feed.clientHeight<130;
  if(ROWS.has(m.id)){
    const r=rowOf(m);ROWS.get(m.id).replaceWith(r);ROWS.set(m.id,r);
  }else{
    const list=$('list');
    const lastRow=[...list.querySelectorAll('.row')].pop();
    if(!lastRow||new Date(+lastRow.dataset.id&&MSGS.get(+lastRow.dataset.id).created*1000).toDateString()!==new Date(m.created*1000).toDateString())
      list.appendChild(sep(m.created));
    const r=rowOf(m);ROWS.set(m.id,r);list.appendChild(r);
    if(m.id>SEEN_LAST)SEEN_LAST=m.id;
  }
  if(scroll||bottom)toBottom();else if(m.sender!==ME.id){unreadNew++;showFab();}
}
function removeMsg(id){MSGS.delete(id);const r=ROWS.get(id);if(r)r.remove();ROWS.delete(id);SEL.delete(id);}
function refreshTicks(){
  MSGS.forEach(m=>{if(m.sender!==ME.id)return;const r=ROWS.get(m.id);if(!r)return;
    const ft=r.querySelector('.ft');if(!ft)return;
    const old=ft.querySelector('.tk');if(old)old.outerHTML=ticks(m);});
}
function toBottom(){const f=$('feed');f.scrollTop=f.scrollHeight;unreadNew=0;hideFab();markRead();}
function showFab(){$('fab').classList.add('show');const c=$('fabCount');if(unreadNew){c.style.display='grid';c.textContent=unreadNew;}else c.style.display='none';}
function hideFab(){$('fab').classList.remove('show');}
$('fab').onclick=toBottom;
$('feed').addEventListener('scroll',()=>{
  const f=$('feed');
  if(f.scrollHeight-f.scrollTop-f.clientHeight<130){unreadNew=0;hideFab();markRead();}else showFab();
  if(f.scrollTop<220&&MORE&&!loadingOld)loadOld();
},{passive:true});

/* ---------- envelope ---------- */
function applyEnv(d,mode){
  Object.assign(QUOTES,d.quotes||{});Object.assign(NAMES,d.names||{});READS=d.reads||READS;
  CTX=CTX||{};CTX.kind=KEY.startsWith('g:')?'group':'personal';
  CTX.title=d.title;CTX.avatar=d.avatar;CTX.online=d.online;CTX.members=d.members||[];
  CTX.other=d.other?d.other.id:(KEY.startsWith('p:')?(+KEY.split(':')[1]===ME.id?+KEY.split(':')[2]:+KEY.split(':')[1]):0);
  CTX.code=d.code;CTX.owner=d.owner;CTX.blocked=d.blocked;
  $('hTitle').textContent=d.title||'Ramplez';
  $('hAva').outerHTML=avaHTML({name:d.title,avatar:d.avatar,online:d.online,type:CTX.kind==='group'?'group':(CTX.other===ME.id?'saved':'')});
  rebindHead();
  status(d);
  const pins=d.pinned||[];
  if(pins.length){$('pinBar').classList.add('show');$('pinText').textContent=pins[0].body;$('pinBar').dataset.id=pins[0].id;}
  else $('pinBar').classList.remove('show');
  if(mode==='init'){MSGS.clear();MORE=!!d.more;(d.msgs||[]).forEach(m=>MSGS.set(m.id,m));renderAll();SINCE=d.now;requestAnimationFrame(toBottom);}
  else if(mode==='prepend'){
    const f=$('feed'),h=f.scrollHeight;
    (d.msgs||[]).forEach(m=>{if(!MSGS.has(m.id))MSGS.set(m.id,m);});
    MORE=!!d.more;renderAll();f.scrollTop=f.scrollHeight-h;
  }else{
    (d.deleted||[]).forEach(removeMsg);
    let fresh=false;
    (d.msgs||[]).forEach(m=>{const isNew=!MSGS.has(m.id);upsert(m,false);
      if(isNew&&m.sender!==ME.id&&m.created>SINCE-2){fresh=true;beep();notify(d.title,m.kind==='text'?m.body.slice(0,90):'📎 '+(m.fname||m.kind));}});
    refreshTicks();SINCE=Math.max(SINCE,d.now);
    if(fresh&&document.hidden){unreadNew++;badge(totalUnread()+unreadNew);}
  }
  markRead();
}
function status(d){
  const s=$('hStatus');if(!s)return;
  const tp=(d&&d.typing)||[];
  if(tp.length){s.textContent=tp.join(', ')+' печатает…';s.className='tp';return;}
  if(CTX.kind==='group'){s.textContent=(CTX.members||[]).length+' участников · '+((CTX.members||[]).filter(x=>x.online).length)+' в сети';s.className='';return;}
  if(CTX.other===ME.id){s.textContent='заметки себе';s.className='';return;}
  if(CTX.online){s.textContent='в сети';s.className='on';}
  else{s.textContent=ago(d&&d.other?d.other.last_seen:0);s.className='';}
}
function rebindHead(){
  $('hAva').id='hAva';
  $('hInfo').onclick=openInfo;$('hAva').onclick=openInfo;
}
let readT=null;
function markRead(){
  if(!KEY||document.hidden)return;
  clearTimeout(readT);readT=setTimeout(()=>{
    if(!SEEN_LAST)return;
    if((READS[ME.id]||0)>=SEEN_LAST)return;
    READS[ME.id]=SEEN_LAST;
    post('/api/read',{key:KEY,last:SEEN_LAST}).then(loadSide).catch(()=>{});
  },400);
}
async function loadOld(){
  loadingOld=true;
  const first=[...MSGS.keys()].sort((a,b)=>a-b)[0];
  try{const d=await api('/api/history/'+KEY+'?before='+(first||0));if((d.msgs||[]).length)applyEnv(d,'prepend');else MORE=false;}catch(e){}

async function sync(){
  if(!KEY||busy)return;busy=true;
  try{const d=await api('/api/sync/'+KEY+'?since='+SINCE);applyEnv(d,'sync');}catch(e){}
  busy=false;
}

/* ---------- open chat (SPA) ---------- */
async function openChat(k,push){
  if(!k)return;
  KEY=k;MSGS.clear();ROWS.clear();QUOTES={};NAMES={};READS={};SEL.clear();selUI();REPLY=null;replyUI();
  SINCE=0;MORE=false;unreadNew=0;hideFab();
  document.body.classList.add('open');
  $('empty').style.display='none';$('feed').style.display='block';$('composer').style.display='block';$('head').style.display='flex';
  $('list').innerHTML='<div class="emptyBox">Загрузка…</div>';
  if(push!==false)history.pushState({k:k},'','/chat?k='+enc(k));
  renderSide();
  try{const d=await api('/api/history/'+k);if(KEY!==k)return;applyEnv(d,'init');}
  catch(e){$('list').innerHTML='<div class="emptyBox">Не удалось открыть чат</div>';return;}
  const dr=localStorage.getItem(draftKey+k);if(dr){$('input').value=dr;grow();}
  loadSide();
}
function closeChat(){
  KEY=null;document.body.classList.remove('open');
  $('feed').style.display='none';$('composer').style.display='none';$('head').style.display='none';$('pinBar').classList.remove('show');
  $('empty').style.display='grid';history.pushState({},'','/chat');renderSide();
}
window.addEventListener('popstate',e=>{
  const k=new URLSearchParams(location.search).get('k');
  if(k)openChat(k,false);else closeChat();
});
$('btnBack').onclick=closeChat;
$('pinBar').onclick=e=>{if(e.target.id==='pinClose')return;jump(+$('pinBar').dataset.id);};
$('pinClose').onclick=e=>{e.stopPropagation();post('/api/pin',{mid:+$('pinBar').dataset.id}).then(sync).catch(x=>toast(x.message,'err'));};

/* ---------- compose ---------- */
function grow(){const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,132)+'px';}
let tpT=0;
$('input').addEventListener('input',()=>{
  grow();
  if(KEY)localStorage.setItem(draftKey+KEY,$('input').value);
  const n=Date.now();if(KEY&&n-tpT>2200){tpT=n;post('/api/typing',{key:KEY}).catch(()=>{});}
});
$('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&PREFS.enter){e.preventDefault();send();}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send();}
});
$('btnSend').onclick=send;
async function send(){
  const i=$('input'),body=i.value.trim();
  if(!body||!KEY)return;

function compress(file){
  return new Promise(res=>{
    if(!/^image\//.test(file.type)||/gif/.test(file.type))return res(file);
    const fr=new FileReader();
    fr.onload=ev=>{const img=new Image();
      img.onload=()=>{const M=1600;let w=img.width,h=img.height;
        if(w>M||h>M){if(w>h){h=Math.round(h*M/w);w=M;}else{w=Math.round(w*M/h);h=M;}}
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        c.toBlob(b=>res(b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'.jpg'),{type:'image/jpeg'}):file),'image/jpeg',.85);};
      img.onerror=()=>res(file);img.src=ev.target.result;};
    fr.onerror=()=>res(file);fr.readAsDataURL(file);
  });
}
async function upload(file,nameOverride){
  if(!KEY)return;
  if(file.size>32*1024*1024){toast('Файл больше 32 МБ','err');return;}
  const f=await compress(file);
  const fd=new FormData();fd.append('key',KEY);fd.append('reply',REPLY?REPLY.id:0);
  fd.append('file',f,nameOverride||f.name||'file');
  const t=toast('Загрузка '+(nameOverride||f.name)+'…');
  try{const d=await api('/api/upload',{method:'POST',body:fd});REPLY=null;replyUI();upsert(d.msg,true);SINCE=Math.max(SINCE,d.now||SINCE);loadSide();}
  catch(e){toast(e.message,'err');}
}

$('btnMic').onclick=async()=>{
  if(rec&&rec.state==='recording'){recStop(false);return;}
  if(!window.MediaRecorder){toast('Браузер не поддерживает запись','err');return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm','audio/mp4','audio/ogg'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    recChunks=[];recCancel=false;rec=mime?new MediaRecorder(st,{mimeType:mime}):new MediaRecorder(st);
    rec.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
    rec.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());clearInterval(recTimer);$('recBar').classList.remove('show');
      if(recCancel)return;
      const type=rec.mimeType||'audio/webm';
      const ext=type.indexOf('mp4')>=0?'m4a':type.indexOf('ogg')>=0?'ogg':'webm';
      const b=new Blob(recChunks,{type:type});
      if(b.size<600){toast('Слишком коротко','err');return;}
      upload(new File([b],'voice.'+ext,{type:type}),'voice.'+ext);
    };
    rec.start();recT=0;$('recTime').textContent='0:00';$('recBar').classList.add('show');
    recTimer=setInterval(()=>{recT++;$('recTime').textContent=Math.floor(recT/60)+':'+String(recT%60).padStart(2,'0');
      if(recT>=120)recStop(false);},1000);
  }catch(e){toast('Нет доступа к микрофону','err');}
};

        cb(c.toDataURL('image/jpeg',.85));};img.src=ev.target.result;};
    fr.readAsDataURL(f);};

    '<button class="btn pri w" id="ngS">Создать</button><button class="btn w" id="ngX">Отмена</button>',b=>{
    let ids=[];
    b.querySelector('#ngX').onclick=closeModal;
    b.querySelector('#ngP').onclick=()=>{const nm=b.querySelector('#ngN').value;
      userPicker(r=>{ids=r;modal.__t=nm;setTimeout(()=>{$('btnNewGroup').click();
        $('modalBody').querySelector('#ngN').value=nm;
        $('modalBody').querySelector('#ngC').textContent='Выбрано: '+ids.length;
        window.__ngIds=ids;},10);},[]);};
    b.querySelector('#ngS').onclick=async()=>{
      const title=b.querySelector('#ngN').value.trim();
      const use=window.__ngIds||ids;
      if(!title)return toast('Введи название','err');
      try{const d=await post('/api/group',{act:'create',title:title,ids:use});window.__ngIds=null;closeModal();await loadSide();openChat(d.key);}
      catch(e){toast(e.message,'err');}
    };
    if(window.__ngIds)b.querySelector('#ngC').textContent='Выбрано: '+window.__ngIds.length;
  });
};
$('btnSettings').onclick=()=>{
  const p=PREFS;
  modal('<h3>Настройки</h3>'+
    '<div class="row2">'+avaHTML(ME)+'<button class="btn" id="stA">Фото</button><button class="btn" id="stAR">Убрать</button></div>'+
    '<div class="fld"><span class="lb">Имя</span><input class="in" id="stN" value="'+esc(ME.name)+'" maxlength="64"></div>'+
    '<div class="fld"><span class="lb">О себе</span><input class="in" id="stB" value="'+esc(ME.bio)+'" maxlength="200"></div>'+
    '<div class="fld"><span class="lb">Тема</span><div class="seg" id="stT">'+
      ['dark','light','auto'].map(t=>'<button class="chip'+(p.theme===t?' on':'')+'" data-v="'+t+'">'+(t==='dark'?'Тёмная':t==='light'?'Светлая':'Авто')+'</button>').join('')+'</div></div>'+
    '<div class="fld"><span class="lb">Акцент</span><div class="seg" id="stC">'+
      ['#4f8cff','#22c55e','#f59e0b','#ef4444','#a855f7','#06b6d4','#ec4899'].map(c=>'<button class="chip'+(p.accent===c?' on':'')+'" data-v="'+c+'" style="background:'+c+';border-color:'+c+';width:30px;height:30px;padding:0"></button>').join('')+'</div></div>'+
    '<div class="fld"><span class="lb">Фон</span><div class="seg" id="stW">'+
      ['aurora','mesh','grid','plain'].map(w=>'<button class="chip'+(p.wall===w?' on':'')+'" data-v="'+w+'">'+w+'</button>').join('')+'</div></div>'+
    '<div class="fld"><span class="lb">Шрифт: <b id="stFV">'+p.font+'</b>px</span><input type="range" id="stF" min="12" max="22" value="'+p.font+'"></div>'+
    '<div class="fld"><span class="lb">Скругление: <b id="stRV">'+p.radius+'</b>px</span><input type="range" id="stR" min="0" max="26" value="'+p.radius+'"></div>'+
    '<div class="sw">Звук<button class="tg'+(p.sound?' on':'')+'" id="stS"></button></div>'+
    '<div class="sw">Уведомления<button class="tg'+(p.notify?' on':'')+'" id="stNo"></button></div>'+
    '<div class="sw">Enter отправляет<button class="tg'+(p.enter?' on':'')+'" id="stE"></button></div>'+
    '<div class="sw">Показывать «был в сети»<button class="tg'+(p.seen?' on':'')+'" id="stSe"></button></div>'+
    '<button class="btn pri w" id="stSave">Сохранить профиль</button>'+
    '<div class="lb" style="margin-top:6px">Безопасность</div>'+
    '<div class="row2"><input class="in" id="stPO" type="password" placeholder="Старый пароль"><input class="in" id="stPN" type="password" placeholder="Новый"></div>'+
    '<button class="btn w" id="stP">Сменить пароль</button>'+
    '<button class="btn w" id="stEx">⬇ Скачать мои данные</button>'+
    '<a class="btn w" href="/logout" style="text-align:center;text-decoration:none">Выйти</a>'+
    '<button class="btn dn w" id="stDel">Удалить аккаунт</button>'+
    '<button class="btn w" id="stX">Закрыть</button>',b=>{
    const q=s=>b.querySelector(s);
    let av=null;
    q('#stA').onclick=()=>pickImage(d=>{av=d;ME.avatar=d;q('.row2').firstElementChild.outerHTML=avaHTML(ME);});
    q('#stAR').onclick=()=>{av='';ME.avatar='';q('.row2').firstElementChild.outerHTML=avaHTML(ME);};
    const seg=(id,key)=>{q(id).onclick=e=>{const c=e.target.closest('[data-v]');if(!c)return;
      [...q(id).children].forEach(x=>x.classList.toggle('on',x===c));savePrefs({[key]:c.dataset.v});};};
    seg('#stT','theme');seg('#stC','accent');seg('#stW','wall');
    q('#stF').oninput=e=>{q('#stFV').textContent=e.target.value;document.documentElement.style.setProperty('--fs',e.target.value+'px');};
    q('#stF').onchange=e=>savePrefs({font:+e.target.value});
    q('#stR').oninput=e=>{q('#stRV').textContent=e.target.value;document.documentElement.style.setProperty('--br',e.target.value+'px');};
    q('#stR').onchange=e=>savePrefs({radius:+e.target.value});
    const tg=(id,key)=>{q(id).onclick=async()=>{const on=!q(id).classList.contains('on');q(id).classList.toggle('on',on);
      if(key==='notify'&&on&&window.Notification&&Notification.permission==='default'){try{await Notification.requestPermission();}catch(e){}}
      savePrefs({[key]:on});};};
    tg('#stS','sound');tg('#stNo','notify');tg('#stE','enter');tg('#stSe','seen');
    q('#stSave').onclick=async()=>{
      const j={name:q('#stN').value,bio:q('#stB').value};if(av!==null)j.avatar=av;
      try{await post('/api/settings',j);ME.name=j.name;ME.bio=j.bio;drawMe();closeModal();toast('Сохранено','ok');loadSide();}catch(e){toast(e.message,'err');}
    };
    q('#stP').onclick=async()=>{
      try{await post('/api/password',{old:q('#stPO').value,new:q('#stPN').value});q('#stPO').value='';q('#stPN').value='';toast('Пароль изменён','ok');}catch(e){toast(e.message,'err');}
    };
    q('#stEx').onclick=()=>{location.href='/api/export';};
    q('#stDel').onclick=async()=>{
      const c=prompt('Это удалит аккаунт и все сообщения. Введи свой логин: '+ME.username);
      if(c===null)return;
      try{await post('/api/delete_account',{confirm:c});location.href='/';}catch(e){toast(e.message,'err');}
    };
    q('#stX').onclick=closeModal;
  });
};
function drawMe(){
  $('meAva').outerHTML=avaHTML(ME);$('side').querySelector('.ava').id='meAva';
  $('meName').textContent='@'+ME.username;
  $('meAva').onclick=()=>$('btnSettings').click();
}

/* ---------- realtime ---------- */
function conn(t,ok){const c=$('conn');if(!t){c.classList.remove('show');return;}c.textContent=t;c.classList.add('show');c.style.color=ok?'#4ade80':'#fbbf24';}
function connect(){
  try{if(ES)ES.close();}catch(e){}
  ES=new EventSource('/api/stream');
  ES.addEventListener('ready',()=>{esOK=true;conn('');if(KEY)sync();loadSide();});
  ES.addEventListener('msg',e=>{
    const m=JSON.parse(e.data);
    if(m.quote)QUOTES[m.reply]=m.quote;
    if(m.key===KEY){
      const isNew=!MSGS.has(m.id);
      upsert(m,false);
      if(isNew&&m.sender!==ME.id){beep();notify(senderOf(m).name,m.kind==='text'?m.body.slice(0,90):'📎 '+(m.fname||m.kind));
        if(document.hidden){unreadNew++;badge(totalUnread()+unreadNew);}}
      SINCE=Math.max(SINCE,m.updated);
    }
    loadSide();
  });
  ES.addEventListener('sync',e=>{const d=JSON.parse(e.data);if(d.key===KEY)sync();});
  ES.addEventListener('hide',e=>{const d=JSON.parse(e.data);(d.ids||[]).forEach(removeMsg);});
  ES.addEventListener('conv',()=>loadSide());
  ES.addEventListener('typing',e=>{const d=JSON.parse(e.data);if(d.key===KEY)sync();});
  ES.addEventListener('read',e=>{const d=JSON.parse(e.data);if(d.key===KEY){READS[d.uid]=d.last;refreshTicks();}});
  ES.onerror=()=>{esOK=false;conn('Переподключение…',false);};
}
connect();
setInterval(()=>{if(KEY)sync();},4000);
setInterval(()=>{if(!esOK)loadSide();},15000);
setInterval(()=>{post('/api/ping',{}).catch(()=>{});},25000);
setInterval(()=>{if(KEY&&!document.hidden)sync();},1200);
window.addEventListener('online',()=>{conn('');if(KEY)sync();loadSide();});
window.addEventListener('offline',()=>conn('Нет сети',false));
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(KEY)sync();loadSide();markRead();}});
window.addEventListener('beforeunload',()=>{try{ES.close();}catch(e){}});

/* ---------- install ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('btnInstall').style.display='block';});
$('btnInstall').onclick=async()=>{if(!installEvt)return;installEvt.prompt();installEvt=null;$('btnInstall').style.display='none';};
if(window.Notification&&Notification.permission==='default'&&PREFS.notify){
  setTimeout(()=>{try{Notification.requestPermission();}catch(e){}},4000);
}

/* ---------- boot ---------- */
drawMe();renderSide();
$('feed').style.display='none';$('composer').style.display='none';$('head').style.display='none';
if(KEY)openChat(KEY,false);
else{$('empty').style.display='grid';if(innerWidth>820&&CONVS.length)openChat(CONVS[0].key);}
})();
</script>
